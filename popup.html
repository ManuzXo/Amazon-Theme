<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 14px 16px 16px;
      width: 260px;
      font: 13px system-ui, sans-serif;
      background: #1c1f24;
      color: #eaeded;
    }
    h2 {
      margin: 16px 0 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #8a929c;
    }

    /* Interruttore */
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .switch {
      width: 38px;
      height: 22px;
      border-radius: 11px;
      background: #555;
      position: relative;
      transition: background .2s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
    }
    .toggle input:checked + .switch { background: #febd69; }
    .toggle input:checked + .switch::after { transform: translateX(16px); }

    /* Temi */
    #themes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .theme {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }
    .theme .bar { height: 8px; }
    .theme .label { padding: 7px 4px 8px; }
    .theme[aria-pressed="true"] { border-color: #febd69; }

    /* Personalizzato */
    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0;
    }
    input[type="color"] {
      width: 44px;
      height: 24px;
      padding: 0;
      border: 1px solid #444;
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }
    input[type="range"] {
      width: 120px;
      accent-color: #febd69;
    }
    .hint { font-size: 11px; color: #8a929c; margin: 8px 0 0; }
  </style>
</head>
<body>
  <label class="toggle">
    Modalità scura
    <input type="checkbox" id="enabled">
    <span class="switch"></span>
  </label>

  <h2>Tema</h2>
  <div id="themes"></div>

  <h2>Personalizza</h2>
  <div class="field"><span>Sfondo</span><input type="color" data-key="bg"></div>
  <div class="field"><span>Testo</span><input type="color" data-key="text"></div>
  <div class="field"><span>Barra in alto</span><input type="color" data-key="nav"></div>
  <div class="field"><span>Linea sotto la barra</span><input type="color" data-key="accent"></div>
  <div class="field"><span>Luminosità immagini</span><input type="range" data-key="img" min="50" max="100"></div>
  <p class="hint">Modificando un colore si passa al tema "Personalizzato", che resta salvato.</p>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
